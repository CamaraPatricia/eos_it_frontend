<div class="search-container">

  <div class="form-group" *ngIf="this.user()?.roleName === 'ADMIN'">
    <label for="userId">Search tasks for user</label>

    <select
      id="userId"
      name="userId"
      [(ngModel)]="selectedUserId">

      <option [ngValue]="0">
        Select a user
      </option>

      <option
        *ngFor="let user of users()"
        [ngValue]="user.userId">

        {{ user.username }}

      </option>
    </select>
  </div>
  <div class="form-group" *ngIf="this.user()?.roleName !== 'ADMIN'">
    <label for="userId">Search only in my tasks</label>
  </div>

  <div class="form-group"> 
    <label>Task status</label> 
    <div class="status-options"> 
      <label class="checkbox-option"> 
        <input type="checkbox" 
        name="cancelled" 
        [(ngModel)]="selectedStatusOptions.cancelled" 
        /> Cancelled </label> 

        <label class="checkbox-option"> 
          <input type="checkbox" 
          name="inProgress" 
          [(ngModel)]="selectedStatusOptions.inProgress" 
          /> In Progress </label> 

          <label class="checkbox-option"> 
            <input type="checkbox" 
            name="notStarted" 
            [(ngModel)]="selectedStatusOptions.notStarted" 
            /> Not Started </label> 

            <label class="checkbox-option"> 
              <input type="checkbox" 
              name="completed" 
              [(ngModel)]="selectedStatusOptions.completed" 
              /> Completed </label> 
            </div> 
          </div> 

          <div class="form-group"> 
            <label for="dueDate">Due date</label> 
            <input type="date" 
            id="dueDate" 
            name="dueDate" 
            [(ngModel)]="selectedDueDate" /> 
          </div>

  <div class="form-group">
    <label for="taskName">Task name</label>

    <input
      type="text"
      id="taskName"
      name="taskName"
      [(ngModel)]="taskName"
      placeholder="Enter task name" />

  </div>

  <div class="search-actions">
  <button
    type="button"
    (click)="searchTasks()">
    Search
  </button>

  <button
    type="button"
    class="clear-button"
    (click)="clearFilters()">
    Clear filters
  </button>

  <div class="tasks-filter">
        <label class = "filter-label" for="filter">Order your tasks to find them easier</label>
        <select id="filter" 
        [(ngModel)]="selectedFilter" 
        (change)="sortTasks()">
          <option 
          *ngFor="let option of taskSortingOptions" 
          [value]="option.value">{{ option.label }}</option>
        </select>
      </div>
</div>

  <div class="tasks-list">
    @if(this.user()?.roleName === 'ADMIN'){
    <app-task-card
      *ngFor="let task of hidratedTasks()"
      [task]="task"
      (deleted) = "searchTasks()">
    </app-task-card>
  } @else {
    <app-task-card
      *ngFor="let task of tasks()"
      [task]="task"
      (deleted) = "searchTasks()">
    </app-task-card>
  }
  

    @if(totalPages() > 1){
    <div class="pagination">
  <button
    type="button"
    class="pagination-button"
    (click)="previousPage()"
    [disabled]="currentPage() === 0"
    aria-label="Previous page">
    ‹
  </button>

  <span class="pagination-info">
    Page {{ currentPage() + 1 }} of {{ totalPages() }}
  </span>

  <button
    type="button"
    class="pagination-button"
    (click)="nextPage()"
    [disabled]="currentPage() >= totalPages() - 1"
    aria-label="Next page">
    ›
  </button>
</div>
  }
  </div>

</div>
