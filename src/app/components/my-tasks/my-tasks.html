<section class="tasks-page">
  <div class="tasks-container">
    <div class="tasks-header">
      <div>
        <p class="tasks-subtitle">Task overview</p>

        <h1>Here you can see your tasks</h1>

        <p class="tasks-description">
          Review, edit and organize all your assigned tasks.
        </p>
      </div>

      <span class="tasks-count">
        {{ tasks().length }}
        {{ tasks().length === 1 ? 'task' : 'tasks' }}
      </span>
    </div>

    <div class="tasks-list" *ngIf="tasks().length > 0; else noTasks">
      <app-task-card
        *ngFor="let task of tasks()"
        [task]="task"
        [canEditStatus] = "true"
        (deleted) = "loadTasks()">
      </app-task-card>
    </div>

    <ng-template #noTasks>
      <div class="empty-state">
        <span>✓</span>
        <h2>No tasks available</h2>
      </div>
    </ng-template>
  </div>
</section>

<div class="my-tasks-header">
  <div>
    <span class="section-label">Planning</span>
    <h2>My Tasks 📋</h2>
  </div>

  <button
    type="button"
    class="generate-schedule-button"
    [disabled]="scheduleLoading()"
    (click)="generateSchedule()"
  >
    @if (scheduleLoading()) {
      <span class="schedule-spinner"></span>
      Generating...
    } @else {
      <span>✨</span>
      Generate schedule
    }
  </button>
</div>

@if (scheduleError()) {
  <p class="schedule-error">
    {{ scheduleError() }}
  </p>
}

@if (scheduleOpen()) {
  <app-ai-schedule-popup
    [schedule]="scheduleItems()"
    (closed)="closeSchedule()"
  />
}
