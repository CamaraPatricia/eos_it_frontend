<nav>
  <div class = "navbar-top">
  <div class="logo">
    TaskManager
    </div>
  <div class="user-info">
  @if (localStorageUser()) {
    You're connected as {{ localStorageUser()?.username }} - {{localStorageUser()?.roleName}}
    <button class="logout-btn" (click)="logout()">Log out</button>
  } @else {
    Please log in
  }
</div>
  </div>

  <div class = "nav-links" *ngIf = "localStorageUser()">
    <a routerLink = "/homepage">Homepage</a>
    <a routerLink = "/my-tasks">My Tasks</a>
    <a routerLink = "/search">Search</a>
    <a routerLink = "/new-task">New Task</a>
    
    @if (localStorageUser()?.roleName === 'ADMIN') {
    <a routerLink = "/statistics">Statistics</a>
    }
  </div>
</nav>

<router-outlet></router-outlet>
